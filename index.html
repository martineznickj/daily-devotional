<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Devotional — The Seven Moves</title>
<meta name="description" content="A calm daily Bible devotional, read through the Seven Moves. ESV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Daily Devotional</div>
    <nav class="nav">
      <a href="index.html">Today</a>
      <a href="method.html">The Method</a>
      <a href="philosophy.html">Philosophy &amp; Theology</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">Dark</button>
  </header>

  <main>
    <div class="meta">
      <span class="pill" id="movePill">—</span>
      <span class="date" id="dateLabel">—</span>
    </div>
    <h1 id="title">—</h1>
    <div class="sub" id="subtitle"></div>

    <div class="daynav">
      <button id="prevBtn" aria-label="Earlier day">‹ Earlier</button>
      <span id="daynavPos"></span>
      <button id="nextBtn" aria-label="Later day">Later ›</button>
    </div>

    <section class="block" id="readingBlock">
      <div class="label">The Reading</div>
      <div class="scripture" id="readings"></div>
    </section>

    <section class="block" id="wordBlock">
      <div class="label">The Word</div>
      <div class="prose" id="word"></div>
    </section>

    <section class="block" id="applyBlock">
      <div class="label">Apply</div>
      <div class="apply prose" id="apply"></div>
    </section>

    <section class="block" id="prayerBlock">
      <div class="label">Prayer</div>
      <p class="prayer" id="prayer"></p>
    </section>

    <div class="ornament">· · ·</div>

    <section class="archive">
      <div class="archive-head">
        <h2>Earlier Days</h2>
        <div class="view-toggle">
          <button id="calBtn" type="button" class="active">Calendar</button>
          <button id="listBtn" type="button">List</button>
        </div>
      </div>
      <div id="calendar">
        <div class="cal-nav">
          <button id="calPrev" type="button" aria-label="Previous month">‹</button>
          <span class="cal-label" id="calLabel">—</span>
          <button id="calNext" type="button" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <ul class="archive-list hidden" id="archiveList"></ul>
    </section>
  </main>

  <footer>ESV · read through the Seven Moves · <a href="method.html">The Method</a> · <a href="philosophy.html">Philosophy &amp; Theology</a></footer>
</div>

<script src="script.js"></script>
<script>
(function () {
  function el(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function paragraphs(text) {
    return (text || '').split(/\n{2,}/).map(function (p) { return '<p>' + esc(p.trim()) + '</p>'; }).join('');
  }
  function fmtDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function isoDate(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  var list = [];
  var currentIndex = 0;
  var dayIndex = {};
  var calYear = 0, calMonth = 0; // calMonth 0-indexed

  function render(d) {
    el('movePill').textContent = d.move + ' · ' + d.virtue;
    el('dateLabel').textContent = fmtDate(d.date);
    el('title').textContent = d.theme;
    el('subtitle').innerHTML = '<em>Week ' + d.week + ', Day ' + d.day + '.</em> Today\u2019s move: ' + d.move + ' (' + d.virtue + ').';
    el('readings').innerHTML = (d.readings || []).map(function (r) {
      return '<p><span class="ref">' + esc(r.ref) + '</span>' + esc(r.text) + '</p>';
    }).join('');
    el('word').innerHTML = paragraphs(d.word);
    el('apply').innerHTML = paragraphs(d.apply);
    el('prayer').textContent = d.prayer;
    el('readingBlock').classList.toggle('hidden', !(d.readings && d.readings.length));
    el('wordBlock').classList.toggle('hidden', !d.word);
    el('applyBlock').classList.toggle('hidden', !d.apply);
    el('prayerBlock').classList.toggle('hidden', !d.prayer);
  }

  function updateNav() {
    var pos = el('daynavPos');
    if (pos) pos.textContent = 'Day ' + (currentIndex + 1) + ' of ' + list.length;
    var pb = el('prevBtn'), nb = el('nextBtn');
    if (pb) pb.disabled = currentIndex >= list.length - 1;
    if (nb) nb.disabled = currentIndex <= 0;
  }

  function renderArchiveList() {
    var byWeek = {};
    list.forEach(function (d, idx) {
      if (idx === currentIndex) return;
      (byWeek[d.week] = byWeek[d.week] || []).push({ d: d, idx: idx });
    });
    var weeks = Object.keys(byWeek).map(Number).sort(function (a, b) { return b - a; });
    var ul = el('archiveList');
    ul.innerHTML = '';
    weeks.forEach(function (w) {
      var days = byWeek[w].sort(function (a, b) { return a.d.day < b.d.day ? 1 : -1; });
      var h = document.createElement('li');
      h.className = 'week-header';
      h.textContent = 'Week ' + w;
      ul.appendChild(h);
      days.forEach(function (o) {
        var d = o.d;
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML =
          '<span class="d">' + esc(d.date) + '</span>' +
          '<span class="theme">' + esc(d.theme) + '</span>' +
          '<span class="move">' + esc(d.move) + '</span>';
        btn.addEventListener('click', function () { show(o.idx); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        li.appendChild(btn);
        ul.appendChild(li);
      });
    });
  }

  function renderCalendar() {
    var first = new Date(calYear, calMonth, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    el('calLabel').textContent = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    var grid = el('calGrid');
    grid.innerHTML = '';
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(function (w) {
      var c = document.createElement('div');
      c.className = 'cal-dow';
      c.textContent = w;
      grid.appendChild(c);
    });
    for (var i = 0; i < startDow; i++) {
      var fill = document.createElement('div');
      fill.className = 'cal-day cal-empty-fill';
      grid.appendChild(fill);
    }
    var today = new Date().toISOString().slice(0, 10);
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = isoDate(calYear, calMonth, d);
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day';
      if (iso === today) cell.classList.add('today');
      if (dayIndex[iso] !== undefined) {
        cell.classList.add('has');
        cell.textContent = d;
        cell.addEventListener('click', (function (iso) {
          return function () { show(dayIndex[iso]); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        })(iso));
      } else {
        cell.classList.add('empty');
        cell.textContent = d;
        cell.disabled = true;
      }
      grid.appendChild(cell);
    }
  }

  function setView(v) {
    var cal = el('calendar'), listEl = el('archiveList');
    el('calBtn').classList.toggle('active', v === 'cal');
    el('listBtn').classList.toggle('active', v === 'list');
    cal.classList.toggle('hidden', v !== 'cal');
    listEl.classList.toggle('hidden', v !== 'list');
  }

  function show(i) {
    currentIndex = Math.max(0, Math.min(list.length - 1, i));
    render(list[currentIndex]);
    updateNav();
    renderArchiveList();
  }

  el('prevBtn').addEventListener('click', function () { show(currentIndex + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el('nextBtn').addEventListener('click', function () { show(currentIndex - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el('calPrev').addEventListener('click', function () { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
  el('calNext').addEventListener('click', function () { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });
  el('calBtn').addEventListener('click', function () { setView('cal'); });
  el('listBtn').addEventListener('click', function () { setView('list'); });

  fetch('./devotionals.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      list = (data.devotionals || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (!list.length) return;
      list.forEach(function (d, i) { dayIndex[d.date] = i; });
      var today = new Date().toISOString().slice(0, 10);
      var idx = list.findIndex(function (d) { return d.date === today; });
      currentIndex = idx >= 0 ? idx : 0;
      var now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      render(list[currentIndex]);
      updateNav();
      renderArchiveList();
      renderCalendar();
      setView('cal');
    })
    .catch(function (e) {
      el('title').textContent = 'Nothing here yet';
      el('subtitle').textContent = 'The first devotional hasn\u2019t been published.';
      el('readings').innerHTML = '';
      el('word').innerHTML = '<p>Check back soon.</p>';
      el('applyBlock').classList.add('hidden');
      el('prayerBlock').classList.add('hidden');
      console.error(e);
    });
})();
</script>
</body>
</html>
