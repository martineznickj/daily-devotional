<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Devotional — The Seven Moves</title>
<meta name="description" content="A calm daily Bible devotional, read through the Seven Moves. ESV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e6;
    --surface: #fdfaf3;
    --ink: #211d15;
    --muted: #7c7463;
    --faint: #a99f8a;
    --border: #e6ddc8;
    --accent: #a67c1e;
    --accent-soft: rgba(166,124,30,.12);
    --maxw: 660px;
    --serif: "Fraunces", Georgia, "Iowan Old Style", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #16130e;
    --surface: #1e1a13;
    --ink: #ece3d2;
    --muted: #9a917d;
    --faint: #6f6757;
    --border: #352f24;
    --accent: #d0a449;
    --accent-soft: rgba(208,164,73,.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .3s ease, color .3s ease;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0 10px;
  }
  .brand {
    font-family: var(--sans); font-size: 12px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 10px;
  }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .theme-toggle {
    font-family: var(--sans); font-size: 13px; color: var(--muted);
    background: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; letter-spacing: .04em;
    transition: color .2s, border-color .2s;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--faint); }

  /* ---- hero / today ---- */
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 34px 0 6px;
  }
  .pill {
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
    border: 1px solid var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 4px 12px; font-weight: 500;
  }
  .date {
    font-family: var(--sans); font-size: 13px; color: var(--faint); letter-spacing: .03em;
  }
  h1 {
    font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.15;
    font-weight: 500; margin: 8px 0 0; letter-spacing: -.01em;
  }
  .sub {
    font-family: var(--sans); font-size: 13.5px; color: var(--muted); margin-top: 10px;
  }
  .sub em { font-style: italic; }

  section.block { margin-top: 44px; }
  .label {
    font-family: var(--sans); font-size: 11px; letter-spacing: .24em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* scripture */
  .scripture { margin: 0 0 26px; }
  .scripture p {
    font-size: 1.28rem; line-height: 1.55; margin: 0 0 18px;
    font-weight: 350; letter-spacing: .002em;
  }
  .scripture .ref {
    display: block; font-family: var(--sans); font-size: 12px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 4px; font-weight: 500;
  }

  /* word / apply prose */
  .prose p { margin: 0 0 1.15em; font-size: 1.08rem; }
  .prose p:last-child { margin-bottom: 0; }

  /* apply */
  .apply {
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 20px; margin-left: 2px;
  }
  .apply p { margin: 0 0 .9em; font-size: 1.08rem; }
  .apply p:last-child { margin: 0; }

  /* prayer */
  .prayer {
    font-style: italic; font-weight: 300; font-size: 1.14rem; line-height: 1.7;
    text-align: center; margin: 0; color: var(--ink);
  }

  .ornament { text-align: center; color: var(--faint); font-size: 15px; letter-spacing: .5em; margin: 46px 0 8px; }

  /* ---- archive ---- */
  .archive { margin-top: 60px; padding-top: 30px; border-top: 1px solid var(--border); }
  .archive h2 {
    font-family: var(--sans); font-size: 11px; letter-spacing: .24em;
    text-transform: uppercase; color: var(--faint); font-weight: 500; margin: 0 0 6px;
  }
  .archive-list { list-style: none; margin: 0; padding: 0; }
  .archive-list li { border-bottom: 1px solid var(--border); }
  .archive-list button {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 13px 2px; color: var(--ink); font-family: var(--serif); font-size: 15px;
  }
  .archive-list button:hover .theme { color: var(--accent); }
  .archive-list .d { font-family: var(--sans); font-size: 12px; color: var(--faint); }
  .archive-list .theme { transition: color .15s; }
  .archive-list .move { font-family: var(--sans); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  footer {
    font-family: var(--sans); font-size: 11.5px; color: var(--faint);
    text-align: center; padding: 48px 0 56px; letter-spacing: .02em;
  }

  .hidden { display: none !important; }
  @media (max-width: 520px) {
    .archive-list button { grid-template-columns: 78px 1fr; }
    .archive-list .move { grid-column: 2; }
    .scripture p { font-size: 1.18rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Daily Devotional</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">Dark</button>
  </header>

  <main>
    <div class="meta">
      <span class="pill" id="movePill">—</span>
      <span class="date" id="dateLabel">—</span>
    </div>
    <h1 id="title">—</h1>
    <div class="sub" id="subtitle"></div>

    <section class="block" id="readingBlock">
      <div class="label">The Reading</div>
      <div class="scripture" id="readings"></div>
    </section>

    <section class="block" id="wordBlock">
      <div class="label">The Word</div>
      <div class="prose" id="word"></div>
    </section>

    <section class="block" id="applyBlock">
      <div class="label">Apply</div>
      <div class="apply prose" id="apply"></div>
    </section>

    <section class="block" id="prayerBlock">
      <div class="label">Prayer</div>
      <p class="prayer" id="prayer"></p>
    </section>

    <div class="ornament">· · ·</div>

    <section class="archive">
      <h2>Earlier Days</h2>
      <ul class="archive-list" id="archiveList"></ul>
    </section>
  </main>

  <footer>ESV · read through the Seven Moves</footer>
</div>

<script>
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');

  // theme
  try {
    var saved = localStorage.getItem('dd-theme');
    if (saved) root.setAttribute('data-theme', saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      root.setAttribute('data-theme', 'dark');
  } catch (e) {}
  function syncToggle() {
    var dark = root.getAttribute('data-theme') === 'dark';
    toggle.textContent = dark ? 'Light' : 'Dark';
  }
  syncToggle();
  toggle.addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('dd-theme', dark ? 'light' : 'dark'); } catch (e) {}
    syncToggle();
  });

  function el(id) { return document.getElementById(id); }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function paragraphs(text) {
    return (text || '').split(/\n{2,}/).map(function (p) {
      return '<p>' + esc(p.trim()) + '</p>';
    }).join('');
  }

  function fmtDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function render(d) {
    el('movePill').textContent = d.move + ' · ' + d.virtue;
    el('dateLabel').textContent = fmtDate(d.date);
    el('title').textContent = d.theme;
    el('subtitle').innerHTML = '<em>Week ' + d.week + ', Day ' + d.day + '.</em> Today\u2019s move: ' + d.move + ' (' + d.virtue + ').';

    el('readings').innerHTML = (d.readings || []).map(function (r) {
      return '<p><span class="ref">' + esc(r.ref) + '</span>' + esc(r.text) + '</p>';
    }).join('');

    el('word').innerHTML = paragraphs(d.word);
    el('apply').innerHTML = paragraphs(d.apply);
    el('prayer').textContent = d.prayer;

    // hide empty sections
    el('readingBlock').classList.toggle('hidden', !(d.readings && d.readings.length));
    el('wordBlock').classList.toggle('hidden', !d.word);
    el('applyBlock').classList.toggle('hidden', !d.apply);
    el('prayerBlock').classList.toggle('hidden', !d.prayer);
  }

  function renderArchive(list) {
    var ul = el('archiveList');
    ul.innerHTML = '';
    list.forEach(function (d) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML =
        '<span class="d">' + esc(d.date) + '</span>' +
        '<span class="theme">' + esc(d.theme) + '</span>' +
        '<span class="move">' + esc(d.move) + '</span>';
      btn.addEventListener('click', function () { render(d); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  fetch('./devotionals.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var list = (data.devotionals || []).slice().sort(function (a, b) {
        return a.date < b.date ? 1 : -1;
      });
      if (!list.length) return;
      // find today's entry (or fall back to latest)
      var today = new Date().toISOString().slice(0, 10);
      var current = list.find(function (d) { return d.date === today; }) || list[0];
      render(current);
      renderArchive(list);
    })
    .catch(function (e) {
      el('title').textContent = 'Nothing here yet';
      el('subtitle').textContent = 'The first devotional hasn\u2019t been published.';
      el('readings').innerHTML = '';
      el('word').innerHTML = '<p>Check back soon.</p>';
      el('applyBlock').classList.add('hidden');
      el('prayerBlock').classList.add('hidden');
      console.error(e);
    });
})();
</script>
</body>
</html>
