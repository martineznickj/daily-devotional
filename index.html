<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Devotional — The Seven Moves</title>
<meta name="description" content="A calm daily Bible devotional, read through the Seven Moves. ESV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Daily Devotional</div>
    <nav class="nav">
      <a href="index.html">Today</a>
      <a href="method.html">The Method</a>
      <a href="philosophy.html">Philosophy &amp; Theology</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">Dark</button>
  </header>

  <main>
    <div class="meta">
      <span class="pill" id="movePill">—</span>
      <span class="date" id="dateLabel">—</span>
    </div>
    <h1 id="title">—</h1>
    <div class="sub" id="subtitle"></div>

    <section class="block" id="readingBlock">
      <div class="label">The Reading</div>
      <div class="scripture" id="readings"></div>
    </section>

    <section class="block" id="wordBlock">
      <div class="label">The Word</div>
      <div class="prose" id="word"></div>
    </section>

    <section class="block" id="applyBlock">
      <div class="label">Apply</div>
      <div class="apply prose" id="apply"></div>
    </section>

    <section class="block" id="prayerBlock">
      <div class="label">Prayer</div>
      <p class="prayer" id="prayer"></p>
    </section>

    <div class="ornament">· · ·</div>

    <section class="archive">
      <h2>Earlier Days</h2>
      <ul class="archive-list" id="archiveList"></ul>
    </section>
  </main>

  <footer>ESV · read through the Seven Moves · <a href="method.html">The Method</a> · <a href="philosophy.html">Philosophy &amp; Theology</a></footer>
</div>

<script src="script.js"></script>
<script>
(function () {
  function el(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function paragraphs(text) {
    return (text || '').split(/\n{2,}/).map(function (p) {
      return '<p>' + esc(p.trim()) + '</p>';
    }).join('');
  }
  function fmtDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function render(d) {
    el('movePill').textContent = d.move + ' · ' + d.virtue;
    el('dateLabel').textContent = fmtDate(d.date);
    el('title').textContent = d.theme;
    el('subtitle').innerHTML = '<em>Week ' + d.week + ', Day ' + d.day + '.</em> Today\u2019s move: ' + d.move + ' (' + d.virtue + ').';
    el('readings').innerHTML = (d.readings || []).map(function (r) {
      return '<p><span class="ref">' + esc(r.ref) + '</span>' + esc(r.text) + '</p>';
    }).join('');
    el('word').innerHTML = paragraphs(d.word);
    el('apply').innerHTML = paragraphs(d.apply);
    el('prayer').textContent = d.prayer;
    el('readingBlock').classList.toggle('hidden', !(d.readings && d.readings.length));
    el('wordBlock').classList.toggle('hidden', !d.word);
    el('applyBlock').classList.toggle('hidden', !d.apply);
    el('prayerBlock').classList.toggle('hidden', !d.prayer);
  }
  function renderArchive(list) {
    var ul = el('archiveList');
    ul.innerHTML = '';
    list.forEach(function (d) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML =
        '<span class="d">' + esc(d.date) + '</span>' +
        '<span class="theme">' + esc(d.theme) + '</span>' +
        '<span class="move">' + esc(d.move) + '</span>';
      btn.addEventListener('click', function () { render(d); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }
  fetch('./devotionals.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var list = (data.devotionals || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (!list.length) return;
      var today = new Date().toISOString().slice(0, 10);
      var current = list.find(function (d) { return d.date === today; }) || list[0];
      render(current);
      renderArchive(list.filter(function (d) { return d.date !== current.date; }));
    })
    .catch(function (e) {
      el('title').textContent = 'Nothing here yet';
      el('subtitle').textContent = 'The first devotional hasn\u2019t been published.';
      el('readings').innerHTML = '';
      el('word').innerHTML = '<p>Check back soon.</p>';
      el('applyBlock').classList.add('hidden');
      el('prayerBlock').classList.add('hidden');
      console.error(e);
    });
})();
</script>
</body>
</html>
